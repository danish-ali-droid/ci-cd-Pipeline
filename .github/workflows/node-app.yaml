name: my node app
on:
  push:
    branches: [main]
    paths:
      - 'node-app-pipeline/**'
  pull_request: 
    branches: [main]
    paths:
      - 'node-app-pipeline/**'
jobs:
  test:
    runs-on: ubuntu:latest
    steps:
    - name: check the code
      uses: actions/checkout@v4
    - name: setup node
      uses: actions/setup-node@v4
      with:
       node-version: '20'
    - name: install dependencies
      run:  npm install
    - name: start the project
      run: npm start
    - name: test  the project
      run:  npm test && echo " app is running"
  build-&-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
     - name: check the code
       uses: actions/checkout@v4
     - name: login to docker
       uses: docker/login-action@v4    
       with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}
     - name: build and push
       uses: docker/build-push@v6
       with:
         push: true
         tag: ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest
