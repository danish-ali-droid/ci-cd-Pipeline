name: ci-cd pipeline for static website
on:
  push:
    branches: [main]
    paths:
      - 'simple-nginx-static-pipeline/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
       working-directory: ./simple-nginx-static-pipeline/
    steps:
     - name: check the code
       uses: actions/checkout@v4
     - name: making test
       run: echo " code is correct"
  build_push:
     runs-on: ubuntu-latest
     defaults:
       run:
         working-directory: ./simple-nginx-static-pipeline
     needs: test
     steps:
       - name: check the code
         uses: actions/checkout@v4
       - name: build docker image
         uses: docker/login-action@v4
         with:
           username: ${{ secrets.DOCKER_USERNAME }}
           password: ${{ secrets.DOCKER_PASSWORD }}
       - name: build and push to docker registory
         uses: docker/build-push-action@v6
         with:
           context: ./simple-nginx-static-pipeline
           file: ./simple-nginx-static-pipeline/Dockerfile
           push: true
           tags: ${{ secrets.DOCKER_USERNAME }}/my-static-website:latest 
  Deploy: 
     runs-on: ubuntu-latest
     defaults:
       run:
        working-directory: ./simple-nginx-static-pipeline
     needs: build_push
     steps:
       - name: ssh the instance 
         uses: appleboy/ssh-action@v1.0.3
         with:
           username: ${{ secrets.SERVER_NAME }}
           key: ${{ secrets.SERVER_KEY }}
           host: ${{ secrets.SERVER_HOST }}
       - name: checking job is running
         run: echo " login successfull.. "

           

    
